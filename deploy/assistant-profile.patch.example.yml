# Requires dsh-base + dsh-web-app + dsh-life-assistant bundles.
- id: llm-pi-ai
  config:
    providers:
      xuanluo:
        displayName: Xuanluo
        apiKeyEnv: XUANLUO_API_KEY
        api: openai-completions
        baseURL: https://api.xuan-luo.top/v1
        models:
          - id: cn:deepseek-v4.1-flash
            name: cn:deepseek-v4.1-flash
            contextWindow: 1000000
            maxTokens: 65536
            input: [text, image]
- id: agent-default-model
  config:
    provider: xuanluo
    model: cn:deepseek-v4.1-flash
- id: attachment-local
  config:
    imageCompressionConcurrency: 1
- id: workspace-controller
  config:
    documentsDirectory: /var/lib/dsh-life/data
- id: life-assistant
  config:
    host: 127.0.0.1
    port: 3180
    provider: xuanluo
    model: cn:deepseek-v4.1-flash
    batchWindowMs: 5000
    batchMaxMessages: 20
    memoryIdleMs: 300000
    maintenanceHour: 3

# Long-running service: apply configuration changes through a restart.
- id: hmr
  disabled: true
