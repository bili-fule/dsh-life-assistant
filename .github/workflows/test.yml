name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test

  native-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 639ed015397290b3745d163aafe02ffee4aa3f84
          path: upstream-dsh
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - run: python deploy/build-native-request-view.py upstream-dsh
